[project]
name = "argus"
version = "0.1.0"
description = "Telegram monitoring bot powered by a Telethon user session."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.7,<4",
    "aiohttp>=3.9,<4",
    "aiosqlite>=0.19,<1",
    "pydantic-settings>=2.2,<3",
    "Telethon>=1.34,<2",
    "matplotlib>=3.8,<4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
