[project]
name = "argus"
version = "0.1.0"
description = "Telegram monitoring bot powered by a Telethon user session."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.7,<4",
    "aiohttp>=3.9,<4",
    "aiosqlite>=0.19,<1",
    "pydantic-settings>=2.2,<3",
    "Telethon>=1.34,<2",
    "matplotlib>=3.8,<4",
    "tzdata>=2024.1",
    "lxml>=5,<7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
vk-auth = ["playwright>=1.50,<2"]
proxy = ["aiohttp-socks>=0.9,<1"]

[tool.setuptools.package-data]
"app.vk" = ["auth_ui/*.html", "auth_ui/*.css", "auth_ui/*.js"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
